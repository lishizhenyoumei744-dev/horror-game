<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>終焉の皇と、人間の花</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05050a;
    color:#fff;
    font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
}

button{
    font-family:inherit;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 30%,
            #30334d 0%,
            #111321 45%,
            #05050a 100%
        );
}

/* 背景 */

#background{
    position:absolute;
    inset:0;
    z-index:0;
    transition:
        background 1s ease,
        filter 1s ease;
}

.bg-title{
    background:
        radial-gradient(
            circle at 50% 30%,
            #4a4260 0%,
            #19172a 45%,
            #05050a 100%
        );
}

.bg-city{
    background:
        linear-gradient(
            to bottom,
            #303858 0%,
            #596276 45%,
            #171923 100%
        );
}

.bg-forest{
    background:
        radial-gradient(
            ellipse at center,
            #293d39 0%,
            #12201f 45%,
            #050a0a 100%
        );
}

.bg-battle{
    background:
        radial-gradient(
            circle at center,
            #542c38 0%,
            #1d1019 42%,
            #050509 100%
        );
}

.bg-night{
    background:
        linear-gradient(
            to bottom,
            #080b1c,
            #131a38 55%,
            #05060d
        );
}

.bg-ending{
    background:
        linear-gradient(
            to bottom,
            #493b57,
            #84758a 50%,
            #1b1927
        );
}

/* 光 */

#light{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(255,255,255,.08),
            transparent 45%
        );
}

/* 雨 */

#rain{
    position:absolute;
    inset:0;
    z-index:2;
    pointer-events:none;
    opacity:0;
    transition:opacity .8s;
    background:
        repeating-linear-gradient(
            105deg,
            transparent 0,
            transparent 18px,
            rgba(190,210,255,.12) 19px,
            transparent 20px
        );
    animation:rainMove .5s linear infinite;
}

#rain.on{
    opacity:1;
}

@keyframes rainMove{
    from{
        background-position:0 0;
    }
    to{
        background-position:-30px 60px;
    }
}

/* 花びら */

#petals{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    overflow:hidden;
}

.petal{
    position:absolute;
    top:-30px;
    width:9px;
    height:14px;
    border-radius:70% 30% 70% 30%;
    background:rgba(255,190,215,.7);
    animation:fall linear infinite;
}

@keyframes fall{
    0%{
        transform:
            translateY(-30px)
            rotate(0deg);
    }
    100%{
        transform:
            translateY(110vh)
            rotate(620deg);
    }
}

/* キャラクター領域 */

.character{
    position:absolute;
    z-index:5;
    bottom:125px;
    width:300px;
    height:470px;
    opacity:0;
    transform:translateY(25px) scale(.96);
    transition:
        opacity .45s ease,
        transform .45s ease;
    pointer-events:none;
}

.character.show{
    opacity:1;
    transform:translateY(0) scale(1);
}

.character.left{
    left:3%;
}

.character.right{
    right:3%;
}

/*
    外部画像が無くても成立する
    イメージアイコン風キャラクター
*/

.charIcon{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    width:270px;
    height:390px;
}

/* 皇 */

.icon-kou{
    background:
        radial-gradient(
            ellipse at 50% 25%,
            #c8c9d7 0 10%,
            transparent 11%
        ),
        linear-gradient(
            90deg,
            transparent 0 25%,
            #171722 26% 74%,
            transparent 75%
        );
    border-radius:45% 45% 12% 12%;
    filter:drop-shadow(0 0 25px rgba(170,40,75,.4));
}

.icon-kou::before{
    content:"";
    position:absolute;
    top:45px;
    left:76px;
    width:118px;
    height:145px;
    border-radius:48% 48% 42% 42%;
    background:
        radial-gradient(
            circle at 35% 50%,
            #ff405f 0 5px,
            transparent 6px
        ),
        radial-gradient(
            circle at 65% 50%,
            #ff405f 0 5px,
            transparent 6px
        ),
        linear-gradient(
            135deg,
            #d8d8e2,
            #767687
        );
}

.icon-kou::after{
    content:"";
    position:absolute;
    top:170px;
    left:52px;
    width:166px;
    height:190px;
    background:
        linear-gradient(
            90deg,
            #080810,
            #28283b,
            #080810
        );
    clip-path:
        polygon(
            18% 0,
            82% 0,
            100% 100%,
            0 100%
        );
}

/* 雫 */

.icon-shizuku{
    background:
        linear-gradient(
            90deg,
            transparent 0 23%,
            #f4f4fa 24% 76%,
            transparent 77%
        );
    border-radius:45% 45% 20% 20%;
    filter:drop-shadow(0 0 25px rgba(120,180,255,.35));
}

.icon-shizuku::before{
    content:"";
    position:absolute;
    top:50px;
    left:74px;
    width:122px;
    height:145px;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 51%,
            #5b9cff 0 5px,
            transparent 6px
        ),
        radial-gradient(
            circle at 65% 51%,
            #5b9cff 0 5px,
            transparent 6px
        ),
        linear-gradient(
            135deg,
            #fff,
            #d7dced
        );
}

.icon-shizuku::after{
    content:"";
    position:absolute;
    top:175px;
    left:43px;
    width:184px;
    height:190px;
    border-radius:30px 30px 0 0;
    background:
        linear-gradient(
            90deg,
            #b9c9df,
            #eef4ff,
            #9caeca
        );
}

/* 灯影 */

.icon-tokage{
    background:
        linear-gradient(
            90deg,
            transparent 0 22%,
            #54182a 23% 77%,
            transparent 78%
        );
    border-radius:45% 45% 15% 15%;
    filter:drop-shadow(0 0 28px rgba(255,60,70,.4));
}

.icon-tokage::before{
    content:"";
    position:absolute;
    top:48px;
    left:73px;
    width:124px;
    height:145px;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 51%,
            #ff765e 0 5px,
            transparent 6px
        ),
        radial-gradient(
            circle at 65% 51%,
            #ff765e 0 5px,
            transparent 6px
        ),
        linear-gradient(
            135deg,
            #f2d8d8,
            #b77a86
        );
}

.icon-tokage::after{
    content:"";
    position:absolute;
    top:170px;
    left:42px;
    width:186px;
    height:205px;
    background:
        linear-gradient(
            90deg,
            #260b14,
            #7b2239,
            #260b14
        );
    clip-path:
        polygon(
            20% 0,
            80% 0,
            100% 100%,
            0 100%
        );
}

/* 下僕 */

.icon-geboku{
    background:
        linear-gradient(
            90deg,
            transparent 0 23%,
            #202531 24% 76%,
            transparent 77%
        );
    border-radius:48% 48% 15% 15%;
    filter:drop-shadow(0 0 22px rgba(120,140,180,.3));
}

.icon-geboku::before{
    content:"";
    position:absolute;
    top:55px;
    left:77px;
    width:116px;
    height:140px;
    border-radius:50%;
    background:
        radial-gradient(
            circle at 35% 51%,
            #b9e5ff 0 4px,
            transparent 5px
        ),
        radial-gradient(
            circle at 65% 51%,
            #b9e5ff 0 4px,
            transparent 5px
        ),
        linear-gradient(
            135deg,
            #d8dde7,
            #777d8b
        );
}

.icon-geboku::after{
    content:"";
    position:absolute;
    top:175px;
    left:45px;
    width:180px;
    height:200px;
    background:
        linear-gradient(
            90deg,
            #090c12,
            #313949,
            #090c12
        );
    clip-path:
        polygon(
            18% 0,
            82% 0,
            100% 100%,
            0 100%
        );
}

/* 会話UI */

#dialogue{
    position:absolute;
    z-index:20;
    left:3%;
    right:3%;
    bottom:22px;
    min-height:180px;
    padding:22px 28px 28px;
    border:1px solid rgba(255,255,255,.22);
    border-radius:12px;
    background:
        linear-gradient(
            to bottom,
            rgba(8,9,16,.78),
            rgba(3,4,9,.94)
        );
    box-shadow:
        0 -10px 50px rgba(0,0,0,.35);
    display:none;
}

#speaker{
    position:absolute;
    left:22px;
    top:-42px;
    min-width:170px;
    padding:8px 18px;
    border-radius:8px 8px 0 0;
    background:#0b0d18;
    border:1px solid rgba(255,255,255,.22);
    font-size:20px;
    font-weight:bold;
}

#text{
    padding-top:12px;
    font-size:19px;
    line-height:2;
    white-space:pre-wrap;
    min-height:105px;
}

#next{
    position:absolute;
    right:20px;
    bottom:10px;
    color:#aaaec5;
    font-size:12px;
    animation:blink 1.2s infinite;
}

@keyframes blink{
    0%,100%{opacity:.35}
    50%{opacity:1}
}

/* 上部UI */

#topUI{
    position:absolute;
    z-index:30;
    top:15px;
    left:15px;
    right:15px;
    display:none;
    justify-content:space-between;
    align-items:center;
}

#chapter{
    padding:8px 14px;
    border-radius:6px;
    background:rgba(0,0,0,.55);
    color:#d9dcef;
    font-size:13px;
}

.controls{
    display:flex;
    gap:7px;
}

.controlBtn{
    border:1px solid rgba(255,255,255,.25);
    border-radius:6px;
    background:rgba(8,9,16,.78);
    color:#fff;
    padding:7px 11px;
    cursor:pointer;
}

.controlBtn:hover{
    background:rgba(100,90,140,.7);
}

/* タイトル */

#titleScreen{
    position:absolute;
    z-index:50;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(100,85,120,.55),
            rgba(3,4,9,.94) 68%
        );
}

#titleScreen h1{
    font-size:
        clamp(34px,6vw,72px);
    letter-spacing:.12em;
    font-weight:normal;
    text-shadow:
        0 0 12px rgba(220,210,255,.5),
        0 0 35px rgba(100,80,150,.5);
}

#titleScreen .subtitle{
    margin-top:16px;
    color:#c5bfd3;
    letter-spacing:.3em;
}

.titleButtons{
    margin-top:50px;
    display:flex;
    flex-direction:column;
    gap:12px;
    width:280px;
}

.titleBtn{
    height:52px;
    border:1px solid rgba(220,215,240,.3);
    border-radius:8px;
    color:white;
    background:rgba(20,20,32,.82);
    font-size:17px;
    cursor:pointer;
    transition:.2s;
}

.titleBtn:hover{
    transform:translateY(-2px);
    background:rgba(70,60,95,.85);
}

/* ログ */

#logWindow{
    position:absolute;
    z-index:100;
    inset:7%;
    display:none;
    padding:25px;
    overflow:auto;
    border:1px solid rgba(255,255,255,.25);
    border-radius:12px;
    background:rgba(5,6,12,.96);
}

#logWindow h2{
    margin-bottom:20px;
    font-weight:normal;
}

.logLine{
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1px solid rgba(255,255,255,.08);
    line-height:1.7;
}

.logName{
    color:#d7b8cc;
    font-weight:bold;
}

/* 選択肢 */

#choices{
    position:absolute;
    z-index:40;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(650px,90vw);
    display:none;
    flex-direction:column;
    gap:12px;
}

.choiceBtn{
    padding:18px;
    border-radius:9px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(10,11,20,.94);
    color:white;
    font-size:17px;
    cursor:pointer;
}

.choiceBtn:hover{
    background:rgba(85,65,105,.9);
}

/* フェード */

#fade{
    position:absolute;
    z-index:200;
    inset:0;
    background:#000;
    pointer-events:none;
    opacity:0;
    transition:opacity .6s;
}

#fade.active{
    opacity:1;
}

/* エンディング */

#endingScreen{
    position:absolute;
    z-index:150;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:
        radial-gradient(
            circle at center,
            #62536d,
            #181622 65%,
            #05050a
        );
}

#endingScreen h2{
    font-size:
        clamp(35px,6vw,68px);
    font-weight:normal;
    letter-spacing:.15em;
    text-shadow:0 0 30px rgba(255,210,230,.35);
}

#endingScreen p{
    margin-top:25px;
    line-height:2.2;
    color:#ded9e5;
    font-size:17px;
}

#restart{
    margin-top:35px;
    padding:13px 35px;
    border:1px solid rgba(255,255,255,.3);
    border-radius:8px;
    color:#fff;
    background:rgba(10,10,18,.8);
    cursor:pointer;
}

/* スマホ */

@media(max-width:700px){

    .character{
        width:190px;
        height:320px;
        bottom:175px;
    }

    .charIcon{
        width:180px;
        height:270px;
    }

    #dialogue{
        left:10px;
        right:10px;
        bottom:10px;
        min-height:165px;
        padding:20px 17px 25px;
    }

    #text{
        font-size:16px;
    }

    #speaker{
        left:12px;
        top:-38px;
        font-size:16px;
    }

    .controls{
        gap:3px;
    }

    .controlBtn{
        padding:6px 7px;
        font-size:11px;
    }
}
</style>

</head>

<body>

<div id="game">

    <div id="background" class="bg-title"></div>

    <div id="light"></div>

    <div id="rain"></div>

    <div id="petals"></div>

    <!-- キャラクター -->
    <div id="leftCharacter" class="character left">
        <div id="leftIcon" class="charIcon"></div>
    </div>

    <div id="rightCharacter" class="character right">
        <div id="rightIcon" class="charIcon"></div>
    </div>

    <!-- タイトル -->
    <div id="titleScreen">

        <h1>終焉の皇と、人間の花</h1>

        <div class="subtitle">
            ―― 儚い世界で、君を知った ――
        </div>

        <div class="titleButtons">

            <button
                class="titleBtn"
                id="startButton">
                はじめから
            </button>

            <button
                class="titleBtn"
                id="loadButton">
                続きから
            </button>

            <button
                class="titleBtn"
                id="soundButton">
                BGM：ON
            </button>

        </div>

    </div>

    <!-- 上部UI -->
    <div id="topUI">

        <div id="chapter">
            PROLOGUE
        </div>

        <div class="controls">

            <button
                class="controlBtn"
                id="saveButton">
                SAVE
            </button>

            <button
                class="controlBtn"
                id="autoButton">
                AUTO
            </button>

            <button
                class="controlBtn"
                id="skipButton">
                SKIP
            </button>

            <button
                class="controlBtn"
                id="logButton">
                LOG
            </button>

            <button
                class="controlBtn"
                id="titleButton">
                TITLE
            </button>

        </div>

    </div>

    <!-- 会話 -->
    <div id="dialogue">

        <div id="speaker">
            ―
        </div>

        <div id="text">
        </div>

        <div id="next">
            ▼ クリック / Enter
        </div>

    </div>

    <!-- 選択肢 -->
    <div id="choices"></div>

    <!-- ログ -->
    <div id="logWindow">

        <h2>― BACK LOG ―</h2>

        <div id="logContent"></div>

        <button
            class="controlBtn"
            id="closeLog">
            閉じる
        </button>

    </div>

    <!-- フェード -->
    <div id="fade"></div>

    <!-- エンディング -->
    <div id="endingScreen">

        <div>

            <h2>君と、生きる。</h2>

            <p>
                終わるはずだった世界で、<br>
                皇は初めて、人間の意味を知った。<br><br>

                強さではなく。<br>
                永遠でもなく。<br>
                誰かを想う、その一瞬こそが――<br>
                人間の美しさだった。
            </p>

            <button id="restart">
                もう一度
            </button>

        </div>

    </div>

    <!-- BGM -->
    <audio
        id="bgm"
        loop
        preload="auto">
    </audio>

<script>
  /* =========================================================
   PART 1B
   ゲームエンジン・BGM・画面演出
   ========================================================= */

const $ = id => document.getElementById(id);

const bg = $("background");
const rain = $("rain");
const petals = $("petals");

const leftCharacter = $("leftCharacter");
const rightCharacter = $("rightCharacter");

const leftIcon = $("leftIcon");
const rightIcon = $("rightIcon");

const dialogue = $("dialogue");
const speaker = $("speaker");
const textBox = $("text");

const choices = $("choices");
const chapter = $("chapter");

const titleScreen = $("titleScreen");
const topUI = $("topUI");
const endingScreen = $("endingScreen");

const fade = $("fade");
const logWindow = $("logWindow");
const logContent = $("logContent");

const bgm = $("bgm");


/* =========================================================
   ゲーム状態
   ========================================================= */

let currentScene = 0;
let typing = false;
let typeTimer = null;
let fullText = "";

let autoMode = false;
let skipMode = false;
let soundOn = true;

let currentBGM = "";
let audioContext = null;
let bgmGain = null;
let bgmTimer = null;

let log = [];


/* =========================================================
   キャラクター設定
   ========================================================= */

const characters = {

    kou: {
        name: "皇",
        icon: "icon-kou"
    },

    shizuku: {
        name: "雫",
        icon: "icon-shizuku"
    },

    tokage: {
        name: "焔緋 灯影",
        icon: "icon-tokage"
    },

    geboku: {
        name: "下僕",
        icon: "icon-geboku"
    }

};


/* =========================================================
   背景変更
   ========================================================= */

function setBackground(name){

    bg.className = "";

    if(name){
        bg.classList.add("bg-" + name);
    }

}


/* =========================================================
   雨
   ========================================================= */

function setRain(on){

    if(on){
        rain.classList.add("on");
    }else{
        rain.classList.remove("on");
    }

}


/* =========================================================
   花びら生成
   ========================================================= */

function createPetals(){

    petals.innerHTML = "";

    for(let i = 0; i < 22; i++){

        const p = document.createElement("div");

        p.className = "petal";

        p.style.left =
            Math.random() * 100 + "%";

        p.style.animationDuration =
            (5 + Math.random() * 7) + "s";

        p.style.animationDelay =
            (-Math.random() * 10) + "s";

        p.style.opacity =
            0.25 + Math.random() * 0.7;

        petals.appendChild(p);

    }

}


/* =========================================================
   キャラクター表示
   ========================================================= */

function showCharacter(side, id){

    const target =
        side === "left"
        ? leftCharacter
        : rightCharacter;

    const icon =
        side === "left"
        ? leftIcon
        : rightIcon;

    if(!id){

        target.classList.remove("show");

        return;
    }

    const data = characters[id];

    if(!data) return;

    icon.className =
        "charIcon " + data.icon;

    target.classList.add("show");

}


/* =========================================================
   キャラクター非表示
   ========================================================= */

function hideCharacter(side){

    const target =
        side === "left"
        ? leftCharacter
        : rightCharacter;

    target.classList.remove("show");

}


/* =========================================================
   全キャラ非表示
   ========================================================= */

function hideCharacters(){

    leftCharacter.classList.remove("show");
    rightCharacter.classList.remove("show");

}


/* =========================================================
   BGM
   外部音源なしでWeb Audio APIを使用
   シーンごとに雰囲気を変える
   ========================================================= */

const bgmPatterns = {

    title: {
        notes: [220, 277, 330, 277],
        speed: 650,
        wave: "sine",
        volume: 0.035
    },

    city: {
        notes: [196, 247, 294, 247],
        speed: 520,
        wave: "triangle",
        volume: 0.035
    },

    forest: {
        notes: [174, 220, 261, 220],
        speed: 720,
        wave: "sine",
        volume: 0.03
    },

    battle: {
        notes: [110, 146, 123, 164],
        speed: 260,
        wave: "sawtooth",
        volume: 0.025
    },

    night: {
        notes: [146, 174, 220, 174],
        speed: 900,
        wave: "sine",
        volume: 0.028
    },

    ending: {
        notes: [196, 247, 294, 392],
        speed: 1000,
        wave: "sine",
        volume: 0.035
    }

};


/* =========================================================
   AudioContext初期化
   ========================================================= */

function initAudio(){

    if(audioContext) return;

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    bgmGain =
        audioContext.createGain();

    bgmGain.gain.value = 0;

    bgmGain.connect(
        audioContext.destination
    );

}


/* =========================================================
   BGM停止
   ========================================================= */

function stopBGM(){

    if(bgmTimer){

        clearInterval(bgmTimer);
        bgmTimer = null;

    }

    if(bgmGain && audioContext){

        bgmGain.gain.cancelScheduledValues(
            audioContext.currentTime
        );

        bgmGain.gain.setTargetAtTime(
            0,
            audioContext.currentTime,
            0.15
        );

    }

    currentBGM = "";

}


/* =========================================================
   BGM変更
   ========================================================= */

function playBGM(name){

    if(!soundOn) return;

    initAudio();

    if(
        audioContext.state === "suspended"
    ){
        audioContext.resume();
    }

    if(currentBGM === name) return;

    stopBGM();

    const pattern =
        bgmPatterns[name];

    if(!pattern) return;

    currentBGM = name;

    bgmGain.gain.setTargetAtTime(
        pattern.volume,
        audioContext.currentTime,
        0.25
    );

    let index = 0;

    function playNote(){

        if(!soundOn) return;

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type = pattern.wave;

        osc.frequency.value =
            pattern.notes[index];

        gain.gain.setValueAtTime(
            0,
            audioContext.currentTime
        );

        gain.gain.linearRampToValueAtTime(
            0.22,
            audioContext.currentTime + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime +
            pattern.speed / 1000
        );

        osc.connect(gain);
        gain.connect(bgmGain);

        osc.start();

        osc.stop(
            audioContext.currentTime +
            pattern.speed / 1000
        );

        index =
            (index + 1) %
            pattern.notes.length;

    }

    playNote();

    bgmTimer =
        setInterval(
            playNote,
            pattern.speed
        );

}


/* =========================================================
   効果音
   ========================================================= */

function soundEffect(
    frequency = 440,
    duration = 0.12,
    type = "sine"
){

    if(!soundOn) return;

    initAudio();

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = type;

    osc.frequency.setValueAtTime(
        frequency,
        audioContext.currentTime
    );

    gain.gain.setValueAtTime(
        0.001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.15,
        audioContext.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
        audioContext.currentTime + duration
    );

}


/* =========================================================
   画面フェード
   ========================================================= */

function fadeOut(callback){

    fade.classList.add("active");

    setTimeout(() => {

        if(callback) callback();

    }, 550);

}


function fadeIn(){

    setTimeout(() => {

        fade.classList.remove("active");

    }, 100);

}


/* =========================================================
   章表示
   ========================================================= */

function setChapter(name){

    chapter.textContent = name;

}


/* =========================================================
   テキスト表示
   ========================================================= */

function showText(content){

    fullText = content;

    textBox.textContent = "";

    typing = true;

    let index = 0;

    clearInterval(typeTimer);

    const speed =
        skipMode ? 1 : 28;

    typeTimer =
        setInterval(() => {

            textBox.textContent =
                fullText.slice(
                    0,
                    index + 1
                );

            index++;

            if(index >= fullText.length){

                clearInterval(typeTimer);

                typing = false;

                if(autoMode){

                    setTimeout(
                        nextScene,
                        1100
                    );

                }

            }

        }, speed);

}


/* =========================================================
   文字送り
   ========================================================= */

function finishTyping(){

    if(!typing) return;

    clearInterval(typeTimer);

    textBox.textContent =
        fullText;

    typing = false;

}


/* =========================================================
   ログ
   ========================================================= */

function addLog(name, message){

    log.push({
        name,
        message
    });

    if(log.length > 100){

        log.shift();

    }

}


/* =========================================================
   ログ表示
   ========================================================= */

function openLog(){

    logContent.innerHTML = "";

    for(const item of log){

        const div =
            document.createElement("div");

        div.className = "logLine";

        div.innerHTML =
            `<div class="logName">
                ${escapeHTML(item.name)}
            </div>
            <div>
                ${escapeHTML(item.message)}
            </div>`;

        logContent.appendChild(div);

    }

    logWindow.style.display =
        "block";

}


/* =========================================================
   HTMLエスケープ
   ========================================================= */

function escapeHTML(str){

    return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   会話表示
   ========================================================= */

function showDialogue(data){

    dialogue.style.display =
        "block";

    speaker.textContent =
        data.name || "―";

    if(data.name){

        addLog(
            data.name,
            data.text
        );

    }

    showText(
        data.text
    );

}


/* =========================================================
   選択肢
   ========================================================= */

function showChoices(list){

    choices.innerHTML = "";

    choices.style.display =
        "flex";

    dialogue.style.display =
        "none";

    list.forEach(choice => {

        const button =
            document.createElement("button");

        button.className =
            "choiceBtn";

        button.textContent =
            choice.text;

        button.addEventListener(
            "click",
            () => {

                soundEffect(
                    520,
                    0.08
                );

                choices.style.display =
                    "none";

                if(choice.action){

                    choice.action();

                }

            }
        );

        choices.appendChild(button);

    });

}


/* =========================================================
   選択肢を消す
   ========================================================= */

function hideChoices(){

    choices.style.display =
        "none";

    choices.innerHTML = "";

}


/* =========================================================
   シーン適用
   ========================================================= */

function applyScene(scene){

    if(scene.chapter){

        setChapter(
            scene.chapter
        );

    }

    if(scene.background){

        setBackground(
            scene.background
        );

    }

    if(typeof scene.rain !== "undefined"){

        setRain(
            scene.rain
        );

    }

    if(scene.bgm){

        playBGM(
            scene.bgm
        );

    }

    if(scene.left){

        showCharacter(
            "left",
            scene.left
        );

    }else{

        hideCharacter("left");

    }

    if(scene.right){

        showCharacter(
            "right",
            scene.right
        );

    }else{

        hideCharacter("right");

    }

}


/* =========================================================
   シーン進行
   ========================================================= */

function nextScene(){

    if(typing){

        finishTyping();

        return;

    }

    if(currentScene >= story.length){

        showEnding();

        return;

    }

    const scene =
        story[currentScene];

    currentScene++;

    hideChoices();

    applyScene(scene);

    if(scene.type === "choice"){

        showChoices(
            scene.choices
        );

        return;

    }

    showDialogue(scene);

}


/* =========================================================
   タイトルから開始
   ========================================================= */

function startGame(){

    initAudio();

    currentScene = 0;

    log = [];

    titleScreen.style.display =
        "none";

    endingScreen.style.display =
        "none";

    topUI.style.display =
        "flex";

    dialogue.style.display =
        "block";

    hideChoices();

    createPetals();

    setRain(false);

    setBackground("city");

    playBGM("city");

    fadeIn();

    nextScene();

}


/* =========================================================
   エンディング
   ========================================================= */

function showEnding(){

    dialogue.style.display =
        "none";

    topUI.style.display =
        "none";

    hideCharacters();

    hideChoices();

    setRain(false);

    setBackground("ending");

    playBGM("ending");

    endingScreen.style.display =
        "flex";

}


/* =========================================================
   セーブ
   ========================================================= */

function saveGame(){

    const saveData = {

        currentScene,
        log,
        soundOn,
        savedAt:
            new Date().toISOString()

    };

    localStorage.setItem(
        "kou_shizuku_save",
        JSON.stringify(saveData)
    );

    soundEffect(
        660,
        0.1
    );

    alert("セーブしました。");

}


/* =========================================================
   ロード
   ========================================================= */

function loadGame(){

    const raw =
        localStorage.getItem(
            "kou_shizuku_save"
        );

    if(!raw){

        alert("セーブデータがありません。");

        return;

    }

    try{

        const data =
            JSON.parse(raw);

        currentScene =
            data.currentScene || 0;

        log =
            data.log || [];

        soundOn =
            data.soundOn !== false;

        titleScreen.style.display =
            "none";

        endingScreen.style.display =
            "none";

        topUI.style.display =
            "flex";

        dialogue.style.display =
            "block";

        createPetals();

        playBGM("night");

        nextScene();

    }catch(error){

        alert(
            "セーブデータを読み込めませんでした。"
        );

    }

}

        : "AUTO";

        skipMode
        ? "SKIP：ON"
        : "SKIP";

}

   ========================================================= */

function toggleSound(){

    soundOn =
        !soundOn;

    $("soundButton").textContent =
        soundOn
        ? "BGM：ON"
        : "BGM：OFF";

    if(!soundOn){

        stopBGM();

    }else{

        playBGM(
            currentBGM || "title"
        );

    }

}

    clearInterval(typeTimer);

    typing = false;

    stopBGM();

    dialogue.style.display =
        "none";

    topUI.style.display =
        "none";

    hideCharacters();

    hideChoices();

    endingScreen.style.display =
        "none";

    titleScreen.style.display =
        "flex";

    setBackground("title");

}

    event => {

        if(
            event.target.closest("button")
        ){
            return;

        if(
            titleScreen.style.display !==
            "none"
        ){
            return;
        }

        if(
            logWindow.style.display ===
            "block"
        ){
            return;
        }

        if(
            endingScreen.style.display ===
            "flex"
        ){
            return;
        }

        nextScene();

    }
);

                logWindow.style.display ===
                "block"
            ){
                return;
            }

            nextScene();

        }

    }
);

/* =========================================================
   特別エンディング演出
   ========================================================= */

function showTrueEnding(){

    clearInterval(typeTimer);

    typing = false;

    dialogue.style.display =
        "none";

    topUI.style.display =
        "none";

    hideChoices();

    setRain(false);

    hideCharacters();

    setBackground("ending");

    playBGM("ending");

    fadeOut(() => {

        endingScreen.style.display =
            "flex";

        fadeIn();

    });

}


/* =========================================================
   エンディングボタン
   ========================================================= */

$("restart").addEventListener(

    "click",

    () => {

        currentScene = 0;

        log = [];

        endingScreen.style.display =
            "none";

        titleScreen.style.display =
            "none";

        topUI.style.display =
            "flex";

        dialogue.style.display =
            "block";

        hideChoices();

        createPetals();

        setRain(false);

        setBackground("city");

        playBGM("city");

        nextScene();

    }

);


/* =========================================================
   シーン終了判定を上書き
   ========================================================= */

const originalNextScene =
    nextScene;

nextScene = function(){

    if(typing){

        finishTyping();

        return;

    }

    if(
        currentScene >= story.length
    ){

        showTrueEnding();

        return;

    }

    const scene =
        story[currentScene];

    currentScene++;

    hideChoices();

    applyScene(scene);

    if(scene.type === "choice"){

        showChoices(
            scene.choices
        );

        return;

    }

    showDialogue(scene);

};


/* =========================================================
   ページを離れる前の状態保存
   ========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(
            currentScene > 0 &&
            currentScene < story.length
        ){

            const autoSave = {

                currentScene,

                log,

                soundOn,

                savedAt:
                    new Date().toISOString()

            };

            localStorage.setItem(
                "kou_shizuku_autosave",
                JSON.stringify(autoSave)
            );

        }

    }
);


/* =========================================================
   自動ロード確認
   ========================================================= */

function hasAutoSave(){

    return Boolean(
        localStorage.getItem(
            "kou_shizuku_autosave"
        )
    );

}


/* =========================================================
   スマホ向けタップ演出
   ========================================================= */

document.addEventListener(
    "touchstart",
    () => {

        if(
            audioContext &&
            audioContext.state === "suspended"
        ){

            audioContext.resume();

        }

    },
    {
        passive:true
    }
);


/* =========================================================
   キーボード操作
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape"){

            if(
                logWindow.style.display ===
                "block"
            ){

                logWindow.style.display =
                    "none";

            }

        }

    }
);
