<!DOCTYPE html>
<html lang="ja">

<title>Θαύμα - 白い部屋</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#030305;
  color:#ddd;
  font-family:

}

body{

}

button{

}

#game{

  overflow:hidden;

}

#noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.055;
  z-index:20;
  background-image:

      transparent 2px,

}

#vignette{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:19;
  background:

}

#flash{
  position:fixed;
  inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
  z-index:30;
}

#bloodFlash{
  position:fixed;
  inset:0;
  background:#300009;
  opacity:0;
  pointer-events:none;
  z-index:29;
}

#app{

  margin:auto;
  position:relative;
  z-index:5;

}

.screen{

}

.screen.active{

}

.titleScreen{

}

.titleScreen:not(.active){

}

.logo{

.titleSub{

.warning{

.menu{

.characterName{

<script>
"use strict";

/* =========================================================
   セーブ
========================================================= */

const SAVE_KEY = "THAUMA_HORROR_NOVEL_V1";


function defaultGame(){

  return {
    scene:0,
    sound:true,
    flags:{
      trustedServant:false,
      openedDoor:false,
      investigated:false,
      stayedWithGouen:false,
      toueiQuestioned:false,
      sawReflection:false
    }
  };

}


let game = defaultGame();


function save(){

  try{
    localStorage.setItem(
      SAVE_KEY,
      JSON.stringify(game)
    );
  }catch(e){
    console.warn(e);
  }

}


function load(){

  try{

    const raw =
      localStorage.getItem(SAVE_KEY);

    if(!raw){
      return false;
    }

    const data =
      JSON.parse(raw);

    game = {
      ...defaultGame(),
      ...data,
      flags:{
        ...defaultGame().flags,
        ...(data.flags || {})
      }
    };

    return true;

  }catch(e){

    game = defaultGame();

    return false;

  }

}
