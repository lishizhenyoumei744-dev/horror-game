<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>残響のアストライア - Echoes of Astraea</title>
    <style>
        /* --- 基本スタイル --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #020208;
            color: #e2e8f0;
            font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            width: 100%;
            max-width: 1000px;
            height: 100vh;
            max-height: 700px;
            position: relative;
            background: #03030c;
            box-shadow: 0 0 50px rgba(100, 150, 255, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            z-index: 1;
        }
        .screen.active {
            display: flex;
            opacity: 1;
            z-index: 2;
        }

        /* --- 共通ボタン --- */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 80%;
            max-width: 320px;
            z-index: 5;
        }
        .btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.4);
            color: #f1f5f9;
            padding: 14px 24px;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
            letter-spacing: 0.15em;
            transition: all 0.4s ease;
            border-radius: 6px;
            font-family: inherit;
            backdrop-filter: blur(4px);
        }
        .btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            color: #ffffff;
        }

        /* --- タイトル画面 --- */
        #titleScreen {
            position: relative;
            background: radial-gradient(circle at center, #091026 0%, #03030c 100%);
        }
        .title-logo {
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            color: #f8fafc;
            text-shadow: 0 0 20px rgba(186, 230, 253, 0.6);
            margin-bottom: 8px;
            z-index: 3;
        }
        .subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 50px;
            letter-spacing: 0.3em;
            z-index: 3;
        }
        #starCanvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        /* --- ストーリー（ノベル）画面 --- */
        #storyScreen {
            background: #020208;
            justify-content: flex-end;
        }
        .story-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            transition: background 1.5s ease;
        }
        .bg-night { background: radial-gradient(circle at 50% 30%, #0c1838 0%, #020208 80%); }
        .bg-sunset { background: radial-gradient(circle at 50% 30%, #3b152b 0%, #08020a 80%); }
        .bg-white { background: radial-gradient(circle at 50% 30%, #2a3a5c 0%, #050a14 80%); }
        .bg-tears { background: radial-gradient(circle at 50% 30%, #111e38 0%, #01040a 80%); }

        .story-box {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 38%;
            background: rgba(5, 9, 20, 0.85);
            border-top: 1px solid rgba(148, 163, 184, 0.25);
            padding: 25px 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            backdrop-filter: blur(8px);
        }
        .speaker-name {
            color: #38bdf8;
            font-size: 1.05rem;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
            font-weight: bold;
        }
        .story-text {
            font-size: 1.05rem;
            line-height: 2.0;
            color: #f1f5f9;
            height: 100%;
            overflow-y: auto;
            white-space: pre-wrap;
            letter-spacing: 0.05em;
        }

        /* 選択肢オーバーレイ */
        #choiceOverlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 2, 8, 0.85);
            z-index: 10;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
            backdrop-filter: blur(5px);
        }

        /* --- パネル（章選択・設定・回想） --- */
        .content-panel {
            width: 88%;
            max-width: 750px;
            height: 82%;
            background: rgba(8, 14, 28, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 8px;
            padding: 25px;
            overflow-y: auto;
            z-index: 5;
            backdrop-filter: blur(10px);
        }
        .panel-title {
            font-size: 1.4rem;
            color: #38bdf8;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            padding-bottom: 8px;
            letter-spacing: 0.15em;
        }
        .chapter-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.15);
            padding: 14px 18px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .chapter-card.unlocked:hover {
            border-color: rgba(56, 189, 248, 0.5);
            background: rgba(30, 41, 59, 0.8);
            cursor: pointer;
        }

        @media (max-width: 650px) {
            .title-logo { font-size: 1.8rem; }
            .subtitle { font-size: 0.8rem; }
            .story-box { height: 50%; padding: 18px; }
            .story-text { font-size: 0.95rem; line-height: 1.8; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- タイトル画面 -->
        <div id="titleScreen" class="screen active">
            <canvas id="starCanvas"></canvas>
            <div class="title-logo">残響のアストライア</div>
            <div class="subtitle">― Echoes of Astraea ―</div>
            <div class="btn-container">
                <button class="btn" onclick="startNewGame()">物語を始める</button>
                <button class="btn" onclick="loadGame()">続きを読む</button>
                <button class="btn" onclick="openChapterSelect()">章選択 (全20章)</button>
            </div>
        </div>

        <!-- 章選択画面 -->
        <div id="chapterSelectScreen" class="screen">
            <div class="content-panel">
                <div class="panel-title">物語の記憶（章一覧）</div>
                <div id="chapterListContainer"></div>
                <button class="btn" style="margin-top:20px; width: 100%;" onclick="showScreen('titleScreen')">タイトルへ戻る</button>
            </div>
        </div>

        <!-- 本編（ノベル）画面 -->
        <div id="storyScreen" class="screen">
            <div class="story-bg" id="storyBg"></div>
            
            <!-- 選択肢ダイアログ -->
            <div id="choiceOverlay">
                <div style="color: #e2e8f0; font-size: 1.1rem; margin-bottom: 10px;" id="choicePrompt">運命を選択してください</div>
                <div id="choiceButtons" class="btn-container"></div>
            </div>

            <!-- メッセージボックス -->
            <div class="story-box" onclick="nextStoryLine()">
                <div>
                    <div class="speaker-name" id="speakerName"></div>
                    <div class="story-text" id="storyText"></div>
                </div>
                <div style="text-align: right; font-size: 0.75rem; color: #64748b; margin-top: 5px;">Click to Next ▶</div>
            </div>
        </div>
    </div>

    <script>
        /* --- 全20章 泣き系重厚シナリオデータ --- */
        const gameStory = [
            {
                chapter: 1, title: "第1章：星の降る夜に", lines: [
                    { speaker: "星空 (奏)", text: "病室の窓からは、今夜も吸い込まれるような星空が見えていた。", bg: "bg-night" },
                    { speaker: "星空 (奏)", text: "僕の名前は奏（かなで）。この孤立した療養所で、光を失っていく日々を送っている。", bg: "bg-night" },
                    { speaker: "アストライア", text: "「綺麗……。ねえ、君もあの星たちが聞こえる？」", bg: "bg-night" },
                    { speaker: "星空 (奏)", text: "それが、僕と彼女――アストライアとの出会いだった。", bg: "bg-night" }
                ]
            },
            {
                chapter: 2, title: "第2章：ガラスの体", lines: [
                    { speaker: "アストライア", text: "「私の体はね、少しずつ星の砂になって消えていくの」", bg: "bg-night" },
                    { speaker: "星空 (奏)", text: "彼女は微笑みながら、透き通るような自分の手首を見つめた。", bg: "bg-night" },
                    { speaker: "星空 (奏)", text: "不治の病『星化症候群』。感情が高ぶるたび、皮膚が光を帯びて結晶化していく奇病。", bg: "bg-night" },
                    { speaker: "アストライア", text: "「だからね、泣くことも怒ることも……誰かを好きになることも許されないの」", bg: "bg-night" }
                ]
            },
            {
                chapter: 3, title: "第3章：ふたりだけの約束", lines: [
                    { speaker: "星空 (奏)", text: "「だったら、僕が君の感情の代わりになる。君の代わりに泣いて、君の代わりに叫ぶよ」", bg: "bg-sunset" },
                    { speaker: "アストライア", text: "「……ふふ、変な奏くん。でも、ありがとう」", bg: "bg-sunset" },
                    { speaker: "星空 (奏)", text: "夕暮れの屋上で、僕たちは小さな指切りをした。それがすべての始まりだった。", bg: "bg-sunset" }
                ]
            },
            {
                chapter: 4, title: "第4章：失われていく日常", lines: [
                    { speaker: "星空 (奏)", text: "日々は過ぎ、アストライアの右足はすでに輝く結晶へと変わりつつあった。", bg: "bg-night" },
                    { speaker: "アストライア", text: "「車椅子を押してくれる奏くんの手、すごく温かいよ」", bg: "bg-night" },
                    { speaker: "星空 (奏)", text: "僕は必死に笑顔を作った。涙がこぼれそうになるのを、必死で噛み殺しながら。", bg: "bg-night" }
                ]
            },
            {
                chapter: 5, title: "第5章：未完成の絵本", lines: [
                    { speaker: "アストライア", text: "「私ね、物語を書いているの。星になった少女が、大切な人を探すお話」", bg: "bg-sunset" },
                    { speaker: "星空 (奏)", text: "彼女のスケッチブックには、繊細で儚いイラストと、未完成の文章が並んでいた。", bg: "bg-sunset" },
                    { speaker: "アストライア", text: "「結末は……まだ決められないの。だって、離れたくないから」", bg: "bg-sunset" }
                ]
            },
            {
                chapter: 6, title: "第6章：夜を越えて", lines: [
                    { speaker: "星空 (奏)", text: "ある夜、アストライアの発作が起きた。激しい痛みが彼女の身体を襲う。", bg: "bg-tears" },
                    { speaker: "アストライア", text: "「うぁ……あっ……奏くん……こわいよ……消えたくないよ……！」", bg: "bg-tears" },
                    { speaker: "星空 (奏)", text: "僕は彼女を強く抱きしめた。光を放つ彼女の体が、冷たく、そして恐ろしいほど美しかった。", bg: "bg-tears" }
                ]
            },
            {
                chapter: 7, title: "第7章：残された時間", lines: [
                    { speaker: "主治医", text: "「彼女の結晶化は最終段階に入りました。次の流星群の夜……それが限界でしょう」", bg: "bg-white" },
                    { speaker: "星空 (奏)", text: "白い廊下で、宣告は残酷に響いた。残された時間はあとわずか。", bg: "bg-white" }
                ]
            },
            {
                chapter: 8, title: "第8章：最後の逃避行", lines: [
                    { speaker: "星空 (奏)", text: "「行こう、アストライア。病院の外へ。君が見たかった海へ」", bg: "bg-night" },
                    { speaker: "アストライア", text: "「奏くん……うん！ 私、奏くんとならどこへでも行ける」", bg: "bg-night" },
                    { speaker: "星空 (奏)", text: "僕たちは真夜中の病院を抜け出し、海を目指して走り出した。", bg: "bg-night" }
                ]
            },
            {
                chapter: 9, title: "第9章：波音と面影", lines: [
                    { speaker: "アストライア", text: "「わぁ……これが、夜の海……！ 星が海に映って、まるで宇宙みたい」", bg: "bg-night" },
                    { speaker: "星空 (奏)", text: "車椅子から身を乗り出し、子供のように瞳を輝かせる彼女。", bg: "bg-night" },
                    { speaker: "星空 (奏)", text: "だが、その両腕はすでに指先まで透明な輝きに覆われていた。", bg: "bg-night" }
                ]
            },
            {
                chapter: 10, title: "第10章：運命の選択", lines: [
                    { speaker: "アストライア", text: "「ねえ、奏くん。もし私が完全に星になってしまったら……君はどうする？」", bg: "bg-night", choice: true,
                      options: [
                          { text: "「僕も君と一緒に星になる」", nextFlag: "bad" },
                          { text: "「君の物語を僕が永遠に語り継ぐ」", nextFlag: "true" }
                      ]
                    }
                ]
            },
            {
                chapter: 11, title: "第11章：告白", lines: [
                    { speaker: "アストライア", text: "「私ね……奏くんに出会えて、本当に幸せだったよ」", bg: "bg-sunset" },
                    { speaker: "アストライア", text: "「生まれた時から病気で、ずっと一人だと思ってた。でも……君が世界をくれた」", bg: "bg-sunset" },
                    { speaker: "星空 (奏)", text: "「僕だって……！ 君がいたから、暗闇の中でも生きていけたんだ！」", bg: "bg-sunset" }
                ]
            },
            {
                chapter: 12, title: "第12章：流星の夜", lines: [
                    { speaker: "星空 (奏)", text: "そして、約束の夜がやってきた。空一面を埋め尽くす激しい流星群。", bg: "bg-white" },
                    { speaker: "アストライア", text: "「綺麗……奏くん、見て……星が降ってくるよ……」", bg: "bg-white" },
                    { speaker: "星空 (奏)", text: "彼女の声が、驚くほどかすかになっていく。", bg: "bg-white" }
                ]
            },
            {
                chapter: 13, title: "第13章：崩れゆく輝き", lines: [
                    { speaker: "星空 (奏)", text: "アストライアの体が、強く、強く光り始めた。", bg: "bg-white" },
                    { speaker: "アストライア", text: "「あ……もう、耳も……声も……うまく届かなくなってきちゃった……」", bg: "bg-white" },
                    { speaker: "星空 (奏)", text: "「嫌だ……！ 頼むから消えないでくれ！ アストライア！！」", bg: "bg-white" }
                ]
            },
            {
                chapter: 14, title: "第14章：最後の涙", lines: [
                    { speaker: "アストライア", text: "「泣かないで……奏くん。約束……したでしょ……？」", bg: "bg-tears" },
                    { speaker: "アストライア", text: "「私の代わりに……生きて……笑って……」", bg: "bg-tears" },
                    { speaker: "星空 (奏)", text: "彼女の目から、一滴の透明な涙がこぼれ落ちた。それは空気中で美しい結晶となった。", bg: "bg-tears" }
                ]
            },
            {
                chapter: 15, title: "第15章：光の抱擁", lines: [
                    { speaker: "アストライア", text: "「大好きだよ、奏くん。永遠に……ずっと……」", bg: "bg-white" },
                    { speaker: "星空 (奏)", text: "最後の言葉とともに、彼女の体が目もくらむような光の粒子へと弾けた。", bg: "bg-white" },
                    { speaker: "星空 (奏)", text: "腕の中に残ったのは、温もりではなく、温かい光の残響だけだった。", bg: "bg-white" }
                ]
            },
            {
                chapter: 16, title: "第16章：残された世界", lines: [
                    { speaker: "星空 (奏)", text: "彼女が消えてから、季節が一つ過ぎた。", bg: "bg-sunset" },
                    { speaker: "星空 (奏)", text: "静もり返った病室。彼女の机の上には、一冊の絵本が残されていた。", bg: "bg-sunset" }
                ]
            },
            {
                chapter: 17, title: "第17章：最後のページ", lines: [
                    { speaker: "星空 (奏)", text: "絵本の最後のページ。そこには彼女の筆跡でこう書かれていた。", bg: "bg-sunset" },
                    { speaker: "アストライアの声", text: "『星になった少女は、いつでも君の空で見守っているよ。だから、見上げてね』", bg: "bg-sunset" }
                ]
            },
            {
                chapter: 18, title: "第18章：僕たちの残響", lines: [
                    { speaker: "星空 (奏)", text: "僕は溢れ出る涙を拭い、ペンを取った。彼女の描いた未完成の物語に、続きを書くために。", bg: "bg-night" },
                    { speaker: "星空 (奏)", text: "「君がくれた光を、僕は絶対に絶やさない」", bg: "bg-night" }
                ]
            },
            {
                chapter: 19, title: "第19章：アストライアの詩", lines: [
                    { speaker: "星空 (奏)", text: "夜空を見上げると、一番眩しく輝く星が、まるで微笑むように瞬いた。", bg: "bg-night" },
                    { speaker: "アストライアの声", text: "「ありがとう、奏くん。ずっと、ずっと愛してる」", bg: "bg-night" }
                ]
            },
            {
                chapter: 20, title: "第20章：永遠の星空へ（完結）", lines: [
                    { speaker: "星空 (奏)", text: "風が吹き抜け、星々の歌声が聞こえる。僕たちの物語は、この永遠の空の下で続いていく――。", bg: "bg-night" },
                    { speaker: "システム", text: "【残響のアストライア - True End】ごプレイありがとうございました。", bg: "bg-night" }
                ]
            }
        ];

        /* --- ゲーム進行状態 --- */
        let gameState = {
            unlockedChapter: 1,
            currentChapterIndex: 0,
            currentLineIndex: 0,
            routeFlag: 'true'
        };

        /* --- 画面切り替え --- */
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(screenId);
            if (target) target.classList.add('active');
        }

        function startNewGame() {
            gameState.currentChapterIndex = 0;
            gameState.currentLineIndex = 0;
            showScreen('storyScreen');
            renderStoryLine();
        }

        function loadGame() {
            const saved = localStorage.getItem('astraea_save');
            if (saved) {
                gameState = JSON.parse(saved);
                showScreen('storyScreen');
                renderStoryLine();
            } else {
                alert("セーブデータが存在しません。");
            }
        }

        /* --- 章選択画面 --- */
        function openChapterSelect() {
            const container = document.getElementById('chapterListContainer');
            container.innerHTML = gameStory.map((ch, idx) => {
                const isUnlocked = (idx + 1) <= gameState.unlockedChapter;
                return `
                    <div class="chapter-card ${isUnlocked ? 'unlocked' : ''}" onclick="${isUnlocked ? `selectChapter(${idx})` : ''}">
                        <div>
                            <span style="color: ${isUnlocked ? '#38bdf8' : '#64748b'}; font-size: 0.9rem;">
                                ${ch.title}
                            </span>
                        </div>
                        <div style="font-size: 0.8rem; color: #64748b;">
                            ${isUnlocked ? '▶ 再生' : '🔒 未解放'}
                        </div>
                    </div>
                `;
            }).join('');
            showScreen('chapterSelectScreen');
        }

        function selectChapter(index) {
            gameState.currentChapterIndex = index;
            gameState.currentLineIndex = 0;
            showScreen('storyScreen');
            renderStoryLine();
        }

        /* --- ストーリー描写 & 進行 --- */
        function renderStoryLine() {
            const ch = gameStory[gameState.currentChapterIndex];
            if (!ch) return;

            // 進行状況の自動保存
            if (gameState.currentChapterIndex + 1 > gameState.unlockedChapter) {
                gameState.unlockedChapter = gameState.currentChapterIndex + 1;
            }
            saveGame();

            const line = ch.lines[gameState.currentLineIndex];
            
            // 背景更新
            document.getElementById('storyBg').className = `story-bg ${line.bg || 'bg-night'}`;
            document.getElementById('speakerName').innerText = line.speaker;
            document.getElementById('storyText').innerText = line.text;

            // 選択肢分岐チェック
            const overlay = document.getElementById('choiceOverlay');
            if (line.choice) {
                overlay.style.display = 'flex';
                const btnContainer = document.getElementById('choiceButtons');
                btnContainer.innerHTML = line.options.map(opt => `
                    <button class="btn" onclick="makeChoice('${opt.nextFlag}')">${opt.text}</button>
                `).join('');
            } else {
                overlay.style.display = 'none';
            }
        }

        function nextStoryLine() {
            const overlay = document.getElementById('choiceOverlay');
            if (overlay.style.display === 'flex') return; // 選択肢表示中はクリック進行不可

            const ch = gameStory[gameState.currentChapterIndex];
            if (gameState.currentLineIndex + 1 < ch.lines.length) {
                gameState.currentLineIndex++;
                renderStoryLine();
            } else {
                // 次の章へ
                if (gameState.currentChapterIndex + 1 < gameStory.length) {
                    gameState.currentChapterIndex++;
                    gameState.currentLineIndex = 0;
                    renderStoryLine();
                } else {
                    // 全章終了
                    showScreen('titleScreen');
                }
            }
        }

        function makeChoice(flag) {
            gameState.routeFlag = flag;
            document.getElementById('choiceOverlay').style.display = 'none';
            gameState.currentLineIndex++;
            renderStoryLine();
        }

        function saveGame() {
            localStorage.setItem('astraea_save', JSON.stringify(gameState));
        }

        /* --- タイトルバックグラウンド（星屑パーティクル） --- */
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function initStars() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            stars = [];
            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2,
                    alpha: Math.random(),
                    speed: Math.random() * 0.02 + 0.005
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.fillStyle = `rgba(186, 230, 253, ${Math.abs(star.alpha)})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', initStars);
        window.addEventListener('DOMContentLoaded', () => {
            initStars();
            drawStars();
        });
    </script>
</body>
</html>
